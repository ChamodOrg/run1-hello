server {
    listen 9090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This app has no backend dependency, so there is no /api proxy and no
    # upstream to resolve. /env-config.js is mounted by the platform into the
    # served root; it must never be cached.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
